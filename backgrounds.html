<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AImLab — background options</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#05040b;--text:#f2eefc;--dim:#aaa3c2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;display:block}
.static{position:fixed;inset:0;display:none;background:radial-gradient(70% 55% at 75% 20%,rgba(169,139,255,.22),transparent 70%),radial-gradient(60% 50% at 10% 90%,rgba(255,79,216,.10),transparent 70%),radial-gradient(50% 40% at 90% 90%,rgba(77,227,255,.08),transparent 70%),var(--bg)}
.content{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 40px) 22px 0;max-width:720px}
.logo{height:34px}
h1{margin:44px 0 0;font-size:clamp(40px,9vw,76px);line-height:.98;letter-spacing:-.04em}
h1 em{display:block;font-family:'Instrument Serif',serif;font-weight:400;background:linear-gradient(100deg,#fff,#d9ccff,#ff9be6,#8ee9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--dim);font-size:17px;line-height:1.55;max-width:40ch;margin-top:20px}
.card{margin-top:22px;padding:16px 18px;border-radius:16px;background:rgba(12,10,24,.8);border:1px solid rgba(255,255,255,.1);max-width:380px;font-size:14px;color:var(--dim)}
.card b{color:#fff}
.bar{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(0deg,rgba(5,4,11,.95),rgba(5,4,11,.7));border-top:1px solid rgba(255,255,255,.08)}
.bar .name{font:12px 'JetBrains Mono',monospace;color:#a98bff;margin:0 4px 10px;letter-spacing:.06em}
.opts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.opts::-webkit-scrollbar{display:none}
.opts button{flex:none;font:600 14px 'Space Grotesk',sans-serif;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;cursor:pointer}
.opts button.on{background:linear-gradient(120deg,#e6dcff,#a98bff 45%,#ff7ce0);color:#12052e;border-color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="static" id="static"></div>
<div class="content">
  <img class="logo" src="aimlab-logo.png" alt="AImLab">
  <h1>Reply to every lead <em>at the speed of light.</em></h1>
  <p>AImLab messages people the moment they fill in your form, qualifies them, and books the call.</p>
  <div class="card"><b>Reply on WhatsApp</b> · 8s after submit</div>
</div>
<div class="bar">
  <div class="name" id="name">1 · AURORA</div>
  <div class="opts" id="opts"></div>
</div>
<script>
const HEAD = `precision highp float; uniform float T; uniform vec2 R; varying vec2 uv;
float h(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<5;i++){ v+=a*n(p); p=p*2.03+7.1; a*=0.5; } return v; }
const vec3 BG = vec3(0.020,0.016,0.043), VI = vec3(0.60,0.45,1.0), PK = vec3(1.0,0.32,0.82), CY = vec3(0.30,0.85,1.0);
`;
const OPTS = [
 ['Aurora', 'soft northern-lights curtains drifting across the top', `
void main(){ vec2 p = uv; p.x *= R.x/R.y; vec3 c = BG;
  for (int i=0;i<3;i++){ float fi=float(i);
    float y = 0.80 - fi*0.07 + 0.10*fbm(vec2(p.x*1.3 + T*0.05*(1.0+fi*0.3), fi*3.0 + T*0.03));
    float d = uv.y - y;
    float curtain = exp(-d*d*(d>0.0?60.0:9.0)) * (0.55 + 0.45*fbm(vec2(p.x*7.0 - T*0.15, fi)));
    vec3 col = fi==0.0 ? VI : fi==1.0 ? PK : CY;
    c += col*curtain*0.32; }
  c *= 1.0 - 0.45*length(uv-vec2(0.5,0.35)); gl_FragColor = vec4(c,1.0); }`],
 ['Deep space', 'stars drifting past a faint violet galaxy', `
void main(){ vec2 p = (uv-0.5)*vec2(R.x/R.y,1.0); vec3 c = BG;
  float g = fbm(p*2.2 + vec2(T*0.01,0.0)); float band = exp(-pow((p.y + p.x*0.35)*3.0,2.0));
  c += mix(VI, PK, g)*band*g*0.35 + CY*band*pow(g,4.0)*0.3;
  for (int L=0; L<3; L++){ float fl=float(L); float z = fract(T*0.03*(1.0+fl) + fl*0.33);
    vec2 q = p*(8.0+fl*9.0)/(0.35+z*1.2); vec2 id = floor(q), f = fract(q)-0.5; float s = h(id+fl*17.0);
    float st = step(0.93, s)*smoothstep(0.08,0.0,length(f - (vec2(h(id*1.3),h(id*2.1))-0.5)*0.6));
    c += vec3(0.9,0.9,1.0)*st*(0.4+0.6*sin(T*2.0+s*40.0)*0.5+0.3)*smoothstep(0.0,0.3,z)*smoothstep(1.0,0.7,z); }
  gl_FragColor = vec4(c,1.0); }`],
 ['Gradient mesh', 'big smooth colour gradient slowly morphing (Stripe-style)', `
void main(){ vec2 p = uv*vec2(R.x/R.y,1.0)*1.3; float t = T*0.06;
  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2,1.3) - t));
  float f = fbm(p + 2.5*q + vec2(t*0.7, -t));
  vec3 c = mix(BG, VI*0.55, smoothstep(0.35,0.7,f));
  c = mix(c, PK*0.55, smoothstep(0.55,0.9,q.x)*0.8);
  c = mix(c, CY*0.45, smoothstep(0.6,0.95,q.y)*0.6);
  c *= 0.55 + 0.45*smoothstep(0.0,0.6,uv.y); gl_FragColor = vec4(c,1.0); }`],
 ['Silk', 'folds of glossy satin catching the light', `
void main(){ vec2 p = uv*vec2(R.x/R.y,1.0); float t = T*0.12;
  float w = sin(p.x*3.0 + sin(p.y*2.0+t)*1.5 + t) + sin(p.y*4.0 - p.x*1.5 + t*0.7)*0.6 + fbm(p*1.5+t*0.2)*1.2;
  float fold = pow(0.5+0.5*sin(w*2.2), 6.0);
  vec3 base = mix(VI*0.25, PK*0.25, 0.5+0.5*sin(w*0.7+t));
  vec3 c = BG + base*0.7 + mix(VI, vec3(1.0,0.9,1.0), 0.4)*fold*0.35;
  c *= 0.5 + 0.5*smoothstep(-0.1,0.9,uv.y) ; gl_FragColor = vec4(c,1.0); }`],
 ['Grid horizon', 'glowing perspective grid rolling toward a violet horizon', `
void main(){ vec2 p = uv-vec2(0.5,0.42); p.x *= R.x/R.y; vec3 c = BG;
  c += mix(PK, VI, smoothstep(0.0,0.35,p.y))*exp(-abs(p.y)*9.0)*0.55;
  if (p.y < -0.005){ float z = 0.35/(-p.y); vec2 g = vec2(p.x*z, z + T*0.6);
    vec2 gl = abs(fract(g)-0.5)/fwidth(g); float line = 1.0 - min(min(gl.x,gl.y),1.0);
    c += mix(VI, CY, 0.5+0.5*sin(g.x*0.3))*line*exp(-z*0.12)*0.8; }
  gl_FragColor = vec4(c,1.0); }`],
 ['Clean glow', 'no animation — just a still, soft violet glow', null]
];
const cv = document.getElementById('c'), stat = document.getElementById('static');
const gl = cv.getContext('webgl'); gl && gl.getExtension('OES_standard_derivatives');
const VS = 'attribute vec2 a; varying vec2 uv; void main(){ uv = a*0.5+0.5; gl_Position = vec4(a,0.0,1.0); }';
function prog(fs){ const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x;};
  const p=gl.createProgram(); gl.attachShader(p,mk(gl.VERTEX_SHADER,VS)); gl.attachShader(p,mk(gl.FRAGMENT_SHADER,'#extension GL_OES_standard_derivatives : enable\n'+HEAD+fs)); gl.linkProgram(p); return p; }
let progs = [], cur = 0;
if (gl) {
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  progs = OPTS.map(o => o[2] ? prog(o[2]) : null);
}
const opts = document.getElementById('opts'), nameEl = document.getElementById('name');
OPTS.forEach((o, i) => { const bt = document.createElement('button'); bt.textContent = (i+1) + ' · ' + o[0]; bt.onclick = () => pick(i); opts.appendChild(bt); });
function pick(i){ cur = i; [...opts.children].forEach((b,j)=>b.classList.toggle('on', j===i)); nameEl.textContent = (i+1)+' · '+OPTS[i][0].toUpperCase()+' — '+OPTS[i][1];
  const s = !progs[i]; stat.style.display = s ? 'block' : 'none'; cv.style.display = s ? 'none' : 'block'; }
function size(){ const d = Math.min(devicePixelRatio||1, 1.5); cv.width = innerWidth*d; cv.height = innerHeight*d; }
size(); addEventListener('resize', size);
const t0 = performance.now();
(function f(){ requestAnimationFrame(f); const p = progs[cur]; if (!gl || !p) return;
  gl.viewport(0,0,cv.width,cv.height); gl.useProgram(p);
  const a = gl.getAttribLocation(p,'a'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);
  gl.uniform1f(gl.getUniformLocation(p,'T'), (performance.now()-t0)/1000); gl.uniform2f(gl.getUniformLocation(p,'R'), cv.width, cv.height);
  gl.drawArrays(gl.TRIANGLES,0,3); })();
pick(0);
</script>
</body>
</html>
